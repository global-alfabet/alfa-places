[build]
  command = "npm ci && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The old address (Alfa Places) moves to the new one. places.globalalfabet.com stays on this Netlify site as a
# domain alias so this rule can send every old link to the same page on finda.globalalfabet.com.
[[redirects]]
  from = "https://places.globalalfabet.com/*"
  to = "https://finda.globalalfabet.com/:splat"
  status = 301
  force = true

# Single-page app: every address is handled by React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
