[build]
  command = "npm ci && npm run check"
  publish = "dist"
  # submission-created.mjs emails a confirmation to whoever adds a business (needs RESEND_API_KEY, see README.md)
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The old address (Alfa Places) moves to the new one. places.globalalfabet.com stays on this Netlify site as a
# domain alias so this rule can send every old link to the same page on finda.globalalfabet.com.
[[redirects]]
  from = "https://places.globalalfabet.com/*"
  to = "https://finda.globalalfabet.com/:splat"
  status = 301
  force = true

# Every page is built as its own HTML file (scripts/prerender.js): /destinations is served from destinations.html
# and /business/jetwash from business/jetwash.html. Any other address gets 404.html with a real 404 status, so
# search engines don't index missing pages. The test dashboards have addresses of their own under /dashboard and
# /admin, so those are sent to their page (with a noindex tag).
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
