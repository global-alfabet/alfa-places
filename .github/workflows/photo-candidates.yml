name: Photo candidates
on:
  push:
    branches: [tmp/photo-candidates]
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: mkdir -p tools/photos/out && python tools/photos/fetch.py
        timeout-minutes: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/photos/out public/photos
          git commit -m "chore(photos): web-sized photos [skip ci]"
          git push
