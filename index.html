<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Page title, description, share tags and structured data come from src/lib/seo.js.
         The build (scripts/prerender.js) replaces everything between these markers for each page. -->
    <!--seo:start-->
    <title>Alfa Finda · Find local businesses and places to visit</title>
    <meta name="description" content="Search local businesses, services and attractions, see hours and contact details, plan a trip around places to visit, and list your business on Alfa Finda." />
    <!--seo:end-->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Lets Netlify Forms detect the form at build time. Field names must match src/pages/AddBusiness.jsx.
         "subject" becomes the subject of our notification email; "source" says which form and website it came from. -->
    <form name="add-business" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="subject" /><input type="hidden" name="source" /><input name="businessName" /><input name="kind" /><input name="category" /><input name="otherCategory" /><input name="town" /><input
        name="address"
      /><textarea name="description"></textarea><textarea name="services"></textarea><input name="hours" /><input
        name="payments"
      /><input name="delivery" /><input name="phone" /><input name="whatsapp" /><input name="email" /><input
        name="website"
      /><input name="contactName" /><input name="contactRole" /><input name="consent" /><input name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
